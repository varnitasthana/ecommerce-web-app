name: Production Deployment

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
          MONGO_INITDB_DATABASE: ecommerce

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Run linting
        run: |
          cd server
          npm run lint || echo "No lint script found"
          cd ../client
          npm run lint || echo "No lint script found"

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Run tests
        run: |
          cd server
          npm test || echo "No tests found"
        env:
          MONGODB_URI: mongodb://admin:admin123@localhost:27017/ecommerce?authSource=admin
          JWT_SECRET: test-secret-key
          NODE_ENV: test

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.shopease.com

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd server && npm ci --only=production
          cd ../client && npm ci

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /var/www/shopease-staging
            git pull origin main
            cd server && npm ci --only=production
            cd ../client && npm ci && npm run build
            pm2 restart shopease-staging
        env:
          NODE_ENV: staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://shopease.com

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd server && npm ci --only=production
          cd ../client && npm ci

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Create backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            mongodump --out=/var/backups/shopease/backup-$(date +%Y%m%d-%H%M%S)

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /var/www/shopease
            git pull origin production
            cd server && npm ci --only=production
            cd ../client && npm ci && npm run build
            pm2 restart shopease
            sudo systemctl reload nginx
        env:
          NODE_ENV: production

      - name: Run health check
        run: |
          sleep 10
          curl -f https://shopease.com/health || exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Production deployment successful"
          else
            echo "❌ Production deployment failed"
          fi
